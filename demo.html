<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Menu Demo Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .hub-container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 40px;
            max-width: 600px;
            width: 90%;
            text-align: center;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #0f172a;
        }
        p {
            color: #64748b;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .demo-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s ease;
            color: white;
        }
        .demo-btn.btn-customer { background-color: #3b82f6; }
        .btn-customer:hover { background-color: #2563eb; transform: translateY(-2px); }
        
        .demo-btn.btn-kitchen { background-color: #f59e0b; }
        .btn-kitchen:hover { background-color: #d97706; transform: translateY(-2px); }
        
        .demo-btn.btn-admin { background-color: #10b981; }
        .btn-admin:hover { background-color: #059669; transform: translateY(-2px); }
        
        .emoji {
            margin-right: 12px;
            font-size: 22px;
        }
    </style>
</head>
<body>
    <div class="hub-container">
        <h1>Explore the QR Menu Ecosystem</h1>
        <p>Choose a portal below to experience the application from different perspectives. Whether you are a guest, a chef, or an admin — we have you covered.</p>
        <div class="btn-group">
            <a href="verify.html?table=table_3" class="demo-btn btn-customer">
                <span class="emoji">📱</span> Customer View (The Menu)
            </a>
            <a href="kitchen.html" class="demo-btn btn-kitchen">
                <span class="emoji">👨‍🍳</span> Kitchen Dashboard
            </a>
            <a href="admin.html" class="demo-btn btn-admin">
                <span class="emoji">⚙️</span> Admin Panel
            </a>
        </div>
    </div>
</body>
</html>
